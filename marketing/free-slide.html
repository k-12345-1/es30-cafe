<!doctype html>
<meta charset="utf-8">
<title>Free This Wednesday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --hand: "Architects Daughter", cursive; --banner: "Archivo Narrow", sans-serif;
          --cream: #FFEBAF; --ink: #2F6A79; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; background: var(--cream); color: var(--ink);
         font-family: var(--hand); -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 70px 70px 150px; position: relative; }

  .marks { display: flex; align-items: center; gap: 28px; }
  .marks img { width: 400px; display: block; }
  .plate { background: var(--ink); padding: 8px 14px; border-radius: 12px; display: flex; }
  .plus { font-family: var(--banner); font-size: 74px; line-height: 1; padding-bottom: 10px; }

  .sub { font-size: 40px; margin-top: 40px; }

  .head { font-family: var(--banner); font-size: 124px; line-height: 1.12;
          text-transform: uppercase; text-align: center; margin-top: 40px; }
  .head em { font-style: normal; display: block; }


  .foot { position: absolute; left: 0; right: 0; bottom: 62px; font-size: 34px; text-align: center;
          -webkit-text-stroke: 0.7px var(--ink); }
</style>

<div class="marks">
  <img src="../public/banner.png" alt="ES30 Cafe">
  <span class="plus">&amp;</span>
  <span class="plate"><img src="../public/cafe-es30-banner.png" alt="Cafe ES30"></span>
</div>

<p class="sub">are back together! Come get your:</p>

<h1 class="head">Free sticker<em>Free Insomnia cookie</em></h1>

<p class="foot">Available during the break near the right entrance of Lowell Lecture Hall</p>
