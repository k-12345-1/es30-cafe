<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFEBAF">
<meta name="description" content="Order snacks and drinks from ES30 Cafe.">
<!--
  Static build of the storefront, served by GitHub Pages.
  Checkout is simulated, the giveaway entry goes nowhere and stock resets on
  reload, because a static host cannot run the Node server.
  For real payments, real entries and real stock, run the app:
  npm install && npm start   (see README.md)
-->
<title>ES30 Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  /* The swatch pair. The card is the pale yellow, the ground and ink are blue. */
  --cream: #FFEBAF;
  --blue: #4C9DB0;
  --ink: #2F6A79;
  --hair: rgba(47, 106, 121, 0.3);
  --dot: rgba(47, 106, 121, 0.45);
  /* The one warm note in the palette, kept for stock warnings only. */
  --alert: #C0392B;

  /* The reading column. The card fills the window so its scrollbar sits at the
     edge of the screen; this is the width the content inside it holds to. */
  --col: 440px;
  --gutter: 28px;

  /* One handwriting face throughout, as in the reference. Headings are the same
     letterforms made heavier with a stroke rather than a second family, which is
     what keeps the menu looking hand-lettered by one person. */
  --hand: "Architects Daughter", "Bradley Hand", cursive;
  --banner: "Archivo Narrow", "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--hand);
  -webkit-font-smoothing: antialiased;
}

/* ---------- the phone card ---------- */

.page {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 0;
}

/* The cream runs to the edges of the screen. This is a column for the content
   to sit in, not a card on a different ground, so it has no edge of its own. */
.card {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  max-height: 880px;
  background: var(--cream);
  overflow: hidden;
}

.card-scroll {
  height: 100%;
  overflow-y: auto;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.screen {
  width: min(var(--col), 100%);
  margin-inline: auto;
  padding: 34px 28px 40px;
}

/* Only one screen is in the card at a time, so the opening screen and its
   button are not visible behind the menu. */
.screen.gone { display: none; }

.menu.enter { animation: screenIn 420ms cubic-bezier(.2,.8,.2,1) both; }

@keyframes screenIn {
  from { transform: translateY(36px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* ---------- notched ribbon logo ---------- */

.ribbon {
  --notch: polygon(0% 0%, 100% 0%, 88% 50%, 100% 100%, 0% 100%, 12% 50%);
  display: block;
  width: fit-content;
  margin: 0 auto;
  background: var(--ink);
  clip-path: var(--notch);
  padding: 2px;
}

.ribbon .r2 { background: var(--cream); clip-path: var(--notch); padding: 3px; display: block; }
.ribbon .r3 { background: var(--ink);   clip-path: var(--notch); padding: 2px; display: block; }

.ribbon .r4 {
  background: var(--cream);
  clip-path: var(--notch);
  display: block;
  padding: 10px 52px;
  font-family: var(--banner);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  white-space: nowrap;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--ink);
}

.ribbon-sm .r4 { padding: 7px 32px; font-size: 15px; }

/* ---------- screen one ---------- */

.splash {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Even air above, between and below, rather than the banner and the button
     pinned to the card's edges with a void in the middle. */
  justify-content: space-evenly;
  text-align: center;
}

.art { color: var(--ink); display: block; }

/* The opening artwork. It carries the banner and the drawing together, so it
   is sized to leave the button clear of the fold on a short screen. */
.art-splash {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  max-height: 72svh;
  object-fit: contain;
  margin: 0 auto;
}

.ghost-btn {
  background: none;
  border: none;
  color: var(--ink);
  font-family: var(--hand);
  -webkit-text-stroke: 0.5px var(--ink);
  font-size: 27px;
  letter-spacing: 0.05em;
  cursor: pointer;
  padding: 10px 6px 4px;
  border-bottom: 3px solid transparent;
  transition: border-color 200ms ease, transform 200ms ease;
}

.ghost-btn:hover { border-bottom-color: var(--ink); transform: translateY(-2px); }

/* ---------- screen two ---------- */

/* The heading's own line box adds about 10px of leading above the letters, so
   36px of padding puts the DRINKS letters 46px down from the top of the card. */
.menu {
  padding-top: 36px;
  padding-bottom: 34px;
}

/* The extra room at the foot of the list exists to clear the cart pill, so it
   is only reserved while the pill is on screen. */
.menu.has-cart { padding-bottom: 124px; }

.section-title {
  font-family: var(--hand);
  -webkit-text-stroke: 1.1px var(--ink);
  font-size: 31px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 34px 0 4px;
}

.menu .section-title:first-of-type { margin-top: 0; }

.group-title {
  font-family: var(--hand);
  -webkit-text-stroke: 0.4px var(--ink);
  font-size: 21px;
  margin: 18px 0 6px;
}

/* Item row. The name, leader and price share a baseline inside .row-main; the
   add control centers against that text block rather than the whole row, so the
   plus sits level with the item name. */
.row { padding: 5px 0; }

.row-line {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* The name's words are items of this row, so the row wraps between them and
   the leader and price always end up on the final line, dots and all. */
.row-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 0;
  row-gap: 2px;
}

/* No box of its own: its words are the row's items. It still carries the type
   for them, and still reads as one paragraph to a screen reader. */
.row-name {
  display: contents;
  font-size: 17px;
  line-height: 1.3;
  margin: 0;
  letter-spacing: 0.01em;
}

.row-name .w {
  flex: none;
  font-size: inherit;
  line-height: 1.3;
  margin-right: 0.26em;   /* stands in for the space between words */
}

/* The description wraps on its own line under the item, so a long one never
   squeezes the name, the leader or the price. */
.row-desc {
  font-size: 12.5px;
  line-height: 1.45;
  opacity: 0.62;
  margin: 4px 0 0;
  max-width: 34ch;
}

/* Empty span whose bottom edge is its baseline, so the dots land on the same
   line the item name and the price sit on. */
/* Last word, dots and price as one unbreakable run: whichever line it lands
   on, the dots fill the gap between the name and the price. */
.tail {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: baseline;
}

.leader {
  flex: 1 1 0;
  min-width: 0;
  margin-right: 8px;
  border-bottom: 2.5px dotted var(--dot);
}

/* This face has tight counters, so a heavy stroke closes up the 0s and 6s.
   Lighter stroke plus a little tracking keeps the figures legible. */
/* Prices sit in a column of their own so every dotted run ends at the same
   point, instead of stopping earlier on rows whose price happens to be wider. */
.row-price {
  flex: none;
  min-width: 54px;
  text-align: right;
  font-size: 18px;
  font-family: var(--hand);
  -webkit-text-stroke: 0.25px var(--ink);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

@media (max-width: 400px) {
  .row-price { min-width: 48px; }
}

/* On the narrowest phones the row has little to spare, so the add control and
   the price give back what they can and the dots keep their run. */
@media (max-width: 360px) {
  .row-line { gap: 6px; }
  .row-price { min-width: 44px; }
  .row-ctl { min-width: 66px; }
}

.row-ctl {
  flex: none;
  min-width: 82px;
  display: flex;
  justify-content: flex-end;
}

.add {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2.5px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-family: var(--hand);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  transition: background 170ms ease, color 170ms ease, transform 130ms ease;
}

.add:hover  { background: var(--ink); color: var(--cream); }
.add:active { transform: scale(0.88); }

/* Stepper that replaces the plus once the item is in the cart. */
.row-qty {
  display: flex;
  align-items: center;
  gap: 2px;
  border-radius: 999px;
  padding: 2px;
  background: var(--ink);
  color: var(--cream);
}

.row-qty.pop { animation: pop 250ms cubic-bezier(.2,.8,.2,1); }

@keyframes pop {
  from { transform: scale(0.82); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

.row-qty button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--cream);
  font-family: var(--hand);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: background 150ms ease;
}

.row-qty button:hover:not(:disabled) { background: rgba(255, 235, 175, 0.24); }

.row-qty button:disabled { opacity: 0.35; cursor: not-allowed; }

/* Stock notes: sold out in place of the control, and a line under the item
   when it is down to the last few. Both in red, and heavy enough to catch the
   eye before the customer taps the plus. */
.sold-out {
  font-size: 14px;
  color: var(--alert);
  -webkit-text-stroke: 0.5px var(--alert);
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.row-stock {
  font-size: 12.5px;
  color: var(--alert);
  -webkit-text-stroke: 0.4px var(--alert);
  letter-spacing: 0.02em;
  margin: 3px 0 0;
}

.row-qty span {
  min-width: 20px;
  text-align: center;
  font-family: var(--hand);
  font-weight: 700;
  font-size: 14px;
}

.footnote {
  font-size: 12px;
  line-height: 1.6;
  margin: 26px 0 0;
  opacity: 0.85;
}

.foot { margin-top: 30px; text-align: center; }

.foot-line { font-size: 12px; opacity: 0.7; margin: 4px 0; }
.foot-line:empty { display: none; }

/* ---------- cart bar, pinned inside the card ---------- */

.cart-bar {
  position: absolute;
  left: 0;
  right: 0;
  margin-inline: auto;
  width: min(calc(var(--col) - 40px), calc(100% - 40px));
  bottom: 30px;
  transform: translateY(200%);
  visibility: hidden;
  background: var(--ink);
  color: var(--cream);
  border: none;
  border-radius: 999px;
  padding: 12px 12px 12px 22px;
  font-family: var(--hand);
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(47, 106, 121, 0.26);
  transition: transform 320ms cubic-bezier(.2,.8,.2,1), visibility 320ms;
  z-index: 40;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}

.cart-bar.show { transform: translateY(0); visibility: visible; }

.cart-bar-summary {
  display: flex;
  align-items: baseline;
  gap: 10px;
  letter-spacing: 0.02em;
}

.cart-bar-cta {
  background: var(--cream);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 15px;
  font-family: var(--hand);
  -webkit-text-stroke: 0.4px var(--ink);
  font-size: 14px;
}

/* ---------- paying, inside the card ---------- */

/* Sits above the order sheet and fills the card, so the customer stays on the
   cafe's own screen while Stripe collects the card. */
.pay-screen {
  position: absolute;
  inset: 0;
  z-index: 70;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  padding: 26px 20px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
}

#payScreen[hidden] { display: none; }

.pay-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.pay-top .close { font-size: 26px; padding: 2px 4px; }

.pay-total {
  margin: 0;
  font-size: 19px;
  -webkit-text-stroke: 0.4px var(--ink);
  letter-spacing: 0.02em;
}

/* Stripe renders into an iframe of its own; it only needs the width. */
#stripeMount { flex: 1 0 auto; }

/* ---------- cart sheet, inside the card ---------- */

.sheet-scrim {
  position: absolute;
  inset: 0;
  background: rgba(20, 58, 67, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 260ms ease;
  z-index: 50;
}

.sheet-scrim.open { opacity: 1; pointer-events: auto; }

/* The sheet covers the card: the order is the whole screen while it is open,
   never a panel with the menu showing above it. */
.sheet {
  position: absolute;
  inset: 0;
  background: var(--cream);
  transform: translateY(101%);
  transition: transform 340ms cubic-bezier(.2,.8,.2,1);
  z-index: 60;
  display: flex;
  flex-direction: column;
  padding: 30px 28px 28px;
}

.sheet.open { transform: none; }

/* Both cover the whole card, so nothing shows at the sides, but their contents
   line up with the menu's column. */
.sheet,
.pay-screen { align-items: center; }

.sheet > *,
.pay-screen > * {
  width: min(calc(var(--col) - 2 * var(--gutter)), 100%);
}

.sheet-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.sheet-top h3 {
  -webkit-text-stroke: 1px var(--ink);
  font-family: var(--hand);
  font-weight: 700;
  font-size: 27px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 0;
}

.close {
  background: none;
  border: none;
  color: var(--ink);
  font-size: 28px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
}

/* Pull the list into the sheet's padding so its scrollbar sits beside the
   content instead of on top of the quantity buttons. */
/* The order reads top down from the heading: items, total, name, checkout, one
   after another with no gaps opened between them. Any room left over sits at
   the foot of the sheet. */
.sheet > form { margin-bottom: auto; }

.cart-list {
  flex: 0 1 auto;
  overflow-y: auto;
  padding-right: 10px;
  margin-right: -10px;
}

.cart-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 2px dotted var(--dot);
  align-items: center;
}

.cart-line-name { font-size: 16px; }
.cart-line-sub  { font-size: 13px; opacity: 0.75; margin-top: 3px; letter-spacing: 0.02em; }

.qty { display: flex; align-items: center; gap: 9px; }

.qty button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--hair);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  font-family: var(--hand);
  font-size: 14px;
  line-height: 1;
}

.qty button:hover { background: rgba(47, 106, 121, 0.12); }

.qty span { min-width: 16px; text-align: center; font-family: var(--hand); font-weight: 700; }

.empty { opacity: 0.55; font-size: 15px; padding: 40px 0; text-align: center; }

.totals {
  -webkit-text-stroke: 0.3px var(--ink);
  letter-spacing: 0.02em;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 16px 0 14px;
  border-top: 3px solid var(--ink);
  margin-top: 12px;
  font-family: var(--hand);
  font-weight: 700;
  font-size: 22px;
}

label {
  display: block;
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 6px;
}

input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 2.5px solid var(--hair);
  border-radius: 14px;
  background: transparent;
  color: var(--ink);
  font-family: var(--hand);
  font-size: 16px;
  margin-bottom: 10px;
}

input[type="text"]:focus { outline: none; border-color: var(--ink); }

/* Outlined until there is a name to call out, solid once there is one, so the
   button reads as ready only when it actually is. */
.pay {
  width: 100%;
  padding: 15px;
  border: 2.5px solid var(--hair);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--hand);
  -webkit-text-stroke: 0.6px var(--ink);
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
}

.pay:hover:not(:disabled) { border-color: var(--ink); }

.pay.ready {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
  -webkit-text-stroke: 0.6px var(--cream);
}

.pay.ready:hover:not(:disabled) { background: var(--ink-hover, #26596a); }

.pay:disabled { opacity: 0.4; cursor: not-allowed; }

.err { color: #9c4221; font-size: 13px; margin: 0 0 8px; min-height: 17px; }

.demo-note { text-align: center; font-size: 12px; opacity: 0.6; margin-top: 10px; }

/* The giveaway, offered once the order is placed. Clearly an extra, sitting
   under the receipt rather than in the way of paying. */
.signup {
  width: 100%;
  margin: 26px 0 0;
  padding-top: 20px;
  border-top: 2px dotted var(--dot);
}

.signup-line {
  font-size: 14px;
  line-height: 1.45;
  opacity: 0.85;
  margin: 0 0 10px;
  text-align: center;
}

.signup-row { display: flex; gap: 8px; }

.signup input[type="email"] {
  flex: 1;
  min-width: 0;
  padding: 11px 14px;
  border: 2.5px solid var(--hair);
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font-family: var(--hand);
  font-size: 15px;
  margin: 0;
}

.signup input[type="email"]:focus { outline: none; border-color: var(--ink); }

/* The Enter button only fills in once the field holds an @, so an empty form
   never offers a button that looks ready to take the entry. */
.signup-go {
  flex: none;
  padding: 11px 20px;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--hand);
  font-size: 15px;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: background 170ms ease, color 170ms ease;
}

.signup-go:hover { background: transparent; color: var(--ink); }

.signup-go[data-armed="false"] {
  background: transparent;
  color: var(--ink);
  border-color: var(--hair);
  opacity: 0.6;
}

/* Our own validation message, so the browser's grey bubble never appears. */
.field-note {
  font-size: 13px;
  line-height: 1.4;
  color: #9c4221;
  margin: 8px 0 0;
  min-height: 18px;
  text-align: left;
}

/* ---------- confirmation ---------- */

.confirm {
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 34px 28px;
}

/* An SVG with a width but no height collapses inside a flex column, so pin the
   ratio and keep it from shrinking. */
.confirm .art {
  width: 92px;
  height: auto;
  aspect-ratio: 11 / 10;
  flex: none;
  margin: 20px auto 14px;
}

/* The artwork's own ratio, with a height cap so a short screen (landscape
   phone, small laptop) shrinks it instead of pushing the button off. */
.art-splash {
  flex: none;
  aspect-ratio: 1000 / 1490;
  height: auto;
  max-height: 64svh;
}

.order-number .hash {
  display: inline-block;
  transform: translateY(0.135em);
  margin-right: 0.05em;
}

.ticket-label { font-size: 17px; line-height: 1.2; opacity: 0.7; margin: 0; }

.order-number {
  -webkit-text-stroke: 0.9px var(--ink);
  font-family: var(--hand);
  font-weight: 700;
  font-size: clamp(74px, 27vw, 132px);
  line-height: 1;
  letter-spacing: 0.04em;
  /* The glyphs sit low in their line box, so pull the number up to close the
     gap under the label rather than leaving the slack the box adds. */
  margin: -0.14em 0 4px;
}

/* The thank-you is SVG text on an arc, so it curves over the order number. */
.ticket-arc {
  width: 100%;
  max-width: 400px;
  height: auto;
  aspect-ratio: 400 / 92;
  flex: none;
  margin: 0 auto 8px;
  overflow: visible;
}

.ticket-arc text {
  fill: var(--ink);
  font-family: var(--hand);
  stroke: var(--ink);
  stroke-width: 0.5;
}

.ticket-note {
  font-size: 16px;
  line-height: 1.6;
  margin: 26px 0 0;
  max-width: 34ch;
  opacity: 0.85;
}

.ticket-items {
  list-style: none;
  padding: 24px 0 0;
  margin: 34px 0 0;
  border-top: 2px dotted var(--dot);
  width: 100%;
  font-size: 17px;
  text-align: left;
}

.ticket-items li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; letter-spacing: 0.02em; }

.ticket-total {
  -webkit-text-stroke: 0.25px var(--ink);
  letter-spacing: 0.02em;
  display: flex;
  justify-content: space-between;
  width: 100%;
  border-top: 3px solid var(--ink);
  margin-top: 18px;
  padding-top: 18px;
  font-family: var(--hand);
  font-weight: 700;
  font-size: 24px;
}

.back {
  display: inline-block;
  margin-top: 26px;
  font-family: var(--hand);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 2.5px solid var(--hair);
  padding-bottom: 3px;
}

/* ---------- room to breathe on a laptop or desktop ----------
   The column and its type both grow, so a wide screen shows a comfortable page
   rather than phone-sized text stranded in the middle of it. */

@media (min-width: 900px) and (min-height: 760px) {
  :root { --col: 560px; }
  .card { max-height: 940px; }

  .ribbon .r4 { font-size: 36px; padding: 12px 62px; }
  .ghost-btn { font-size: 32px; }

  .section-title { font-size: 38px; }
  .group-title { font-size: 25px; }
  .row-name { font-size: 20px; }
  .row-price { font-size: 21px; min-width: 64px; }
  .row-desc { font-size: 14px; }
  .row-stock { font-size: 14px; }

  .add { width: 34px; height: 34px; font-size: 18px; }
  .row-qty button { width: 30px; height: 30px; font-size: 17px; }
  .row-qty span { font-size: 16px; min-width: 24px; }
  .row-ctl { min-width: 94px; }

  .cart-bar { font-size: 17px; }
  .cart-bar-cta { font-size: 16px; padding: 9px 20px; }

  .sheet-top h3 { font-size: 32px; }
  .cart-line-name { font-size: 18px; }
  .cart-line-sub { font-size: 14px; }
  .totals { font-size: 26px; }
  .pay { font-size: 20px; }
  label { font-size: 15px; }
  input[type="text"] { font-size: 18px; }

  .ticket-label { font-size: 19px; }
  .ticket-note { font-size: 18px; max-width: 32ch; }
  .ticket-items { font-size: 19px; }
  .ticket-total { font-size: 27px; }
  .signup-line { font-size: 16px; }
  .signup input[type="email"], .signup-go { font-size: 17px; }
}

/* ---------- scrollbars ---------- */

html {
  scrollbar-width: thin;
  scrollbar-color: var(--ink) var(--cream);
}

.card-scroll,
.cart-list,
.sheet,
.confirm {
  scrollbar-width: thin;
  scrollbar-color: var(--ink) transparent;
}

.card-scroll::-webkit-scrollbar,
.cart-list::-webkit-scrollbar,
.sheet::-webkit-scrollbar,
.confirm::-webkit-scrollbar { width: 8px; height: 8px; }

.card-scroll::-webkit-scrollbar-track,
.cart-list::-webkit-scrollbar-track,
.sheet::-webkit-scrollbar-track,
.confirm::-webkit-scrollbar-track { background: transparent; }

.card-scroll::-webkit-scrollbar-thumb,
.cart-list::-webkit-scrollbar-thumb,
.sheet::-webkit-scrollbar-thumb,
.confirm::-webkit-scrollbar-thumb {
  background: var(--ink);
  border-radius: 999px;
}

html::-webkit-scrollbar { width: 12px; }
html::-webkit-scrollbar-track { background: var(--cream); }
html::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 999px; }

/* ---------- phone: the card becomes the whole screen ---------- */

@media (max-width: 520px) {
  .card { width: 100%; }
  .screen { padding: 26px 20px 34px; }
  .menu { padding-bottom: 120px; }
  .sheet { padding: 26px 20px calc(24px + env(safe-area-inset-bottom)); }
}

/* Narrow phones: the longest item name, its price and the stepper have to fit
   one line together, so step the type and the control down. */
@media (max-width: 400px) {
  .screen { padding: 22px 16px 30px; }
  .sheet { padding: 22px 16px calc(20px + env(safe-area-inset-bottom)); }

  .ribbon .r4 { font-size: 25px; padding: 9px 30px; }

  .section-title { font-size: 27px; margin-top: 32px; }
  .group-title { font-size: 19px; }

  .row { gap: 8px; }
  .row-name, .row-price { font-size: 15px; }
  .row-ctl { min-width: 72px; }
  .add { width: 28px; height: 28px; }
  .row-qty button { width: 24px; height: 24px; }
  .row-qty span { min-width: 16px; font-size: 13px; }

  .cart-bar { font-size: 14px; padding: 11px 11px 11px 18px; gap: 9px; }
  .ghost-btn { font-size: 24px; }
}

/* Short screens: trim the vertical rhythm so the whole splash, and the cart
   sheet, still fit without scrolling. */
@media (max-height: 620px) {
  .screen { padding-top: 20px; padding-bottom: 22px; }
  .art-splash { max-height: 52svh; margin: 4px auto; }
  .ribbon .r4 { font-size: 24px; padding: 7px 30px; }
  .ghost-btn { font-size: 22px; padding-top: 4px; }
  .section-title { margin-top: 26px; font-size: 27px; }
  .sheet { padding-top: 20px; padding-bottom: 20px; }
  .sheet-top { margin-bottom: 10px; }
  .sheet-top h3 { font-size: 30px; }
  .totals { padding: 12px 0 10px; font-size: 20px; }
  .pay { padding: 13px; }
  .confirm { padding: 22px 20px; }
  .order-number { font-size: 64px; margin: 4px 0 2px; }
  .ticket-label { font-size: 15px; }
  .ticket-note { font-size: 14px; margin-top: 14px; }
  .ticket-items { font-size: 15px; margin-top: 18px; padding-top: 16px; }
  .ticket-items li { padding: 5px 0; }
  .ticket-total { font-size: 20px; margin-top: 12px; padding-top: 12px; }
  .ticket-items { margin-top: 16px; padding-top: 14px; }
}

/* Below this height the fixed parts of the sheet (heading, total, name field,
   button) leave the item list only a sliver, so scroll the whole sheet instead
   of giving the list its own scroll area. */
@media (max-height: 520px) {
  .sheet { overflow-y: auto; }
  .cart-list {
    flex: none;
    overflow: visible;
    padding-right: 0;
    margin-right: 0;
  }
  .cart-line { padding: 9px 0; }
  .totals { margin-top: 8px; }
}

/* Landscape phones. Very little height, so the splash gets the minimum it needs. */
@media (max-height: 440px) {
  .screen { padding-top: 14px; padding-bottom: 16px; }
  .art-splash { max-height: 48svh; margin: 2px auto; }
  .ribbon .r4 { font-size: 20px; padding: 6px 24px; }
  .ghost-btn { font-size: 19px; padding: 4px 6px 2px; }
  .order-number { font-size: 52px; }
  .ticket-note { margin-top: 10px; }
  .sheet-top h3 { font-size: 25px; }
  .totals { font-size: 18px; }
}


#confirmScreen {
  position: absolute;
  inset: 0;
  background: var(--cream);
  z-index: 70;
}

/* .confirm sets display:flex, which outranks the browser default for [hidden]. */
#confirmScreen[hidden] { display: none; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card-scroll { scroll-behavior: auto; }
}

<script>
const PREVIEW_DATA = {"menu":[{"section":"Drinks","groups":[{"title":"","items":[{"id":"celsius","name":"Celsius","price":500,"available":12},{"id":"waiter","name":"Bottle of WAiTER","price":1000,"desc":"A bottle of water with AI in it to give you the perfect level of hydration.","available":12}]}]},{"section":"Snacks","groups":[{"title":"Sweet","items":[{"id":"cookies-2","name":"2 Chocolate Chip Cookies","price":500,"available":12},{"id":"oreos","name":"4 Oreos","price":100,"available":12}]},{"title":"Savory","items":[{"id":"doritos-cool-ranch","name":"Cool Ranch Doritos","price":300,"available":12},{"id":"doritos-nacho","name":"Nacho Cheese Doritos","price":300,"available":12},{"id":"cheetos-crunchy","name":"Cheetos Crunchy","price":300,"available":12},{"id":"popcorn-white-ched","name":"White Cheddar Popcorn","price":300,"available":12},{"id":"lays-classic","name":"Classic Lays","price":300,"available":12},{"id":"sunchips-harvest","name":"Harvest Cheddar Sun Chips","price":300,"available":12}]}]}],"site":{"hours":"","address":"","email":"","footnote":""},"currency":"usd","demo":true};

const state = { cart: new Map(), items: {}, currency: 'usd', demo: false, stripeKey: '' };

const el = (id) => document.getElementById(id);

const money = (cents) =>
  new Intl.NumberFormat('en-US', { style: 'currency', currency: state.currency.toUpperCase() })
    .format(cents / 100);

/* ---------- ribbon ----------
   The notched banner is four nested clipped layers: ink, cream, ink, cream.
   That gives the double outline without any images. */

function buildRibbons() {
  for (const node of document.querySelectorAll('.ribbon[data-label]')) {
    node.innerHTML =
      `<span class="r2"><span class="r3"><span class="r4">${node.dataset.label}</span></span></span>`;
  }
}

/* ---------- dotted leaders ----------
   The dots have to run from the end of the name to the price on every screen,
   so the name is laid out word by word inside the row. The row wraps between
   words, which leaves the leader and the price on the final line with the dots
   filling whatever is left of it, however narrow the phone.

   On top of that, a name that would only just wrap is stepped down in size so
   it stays on one line. That only happens while the name stays above a floor;
   a name that would have to go smaller than that wraps instead. */

const LEADER_MIN = 44;
const NAME_FLOOR = 12;

// The name is split into words so the row can wrap between them; each word
// carries its own trailing space, since a flex row drops the whitespace
// between its items. The last word, the dots and the price travel together in
// one unbreakable tail, so the price can never be left stranded on a line of
// its own, and the dots always run between the two.
function nameRow(name, price) {
  const words = name.split(/\s+/);
  const last = words.pop();
  return `${words.map((word) => `<span class="w">${word}</span>`).join('')}<span class="tail"><span class="w">${last}</span><span class="leader" aria-hidden="true"></span><span class="row-price">${price}</span></span>`;
}

function fitLeaders() {
  for (const main of document.querySelectorAll('.row-main')) {
    const name = main.querySelector('.row-name');
    const price = main.querySelector('.row-price');
    const tail = main.querySelector('.tail');
    const words = main.querySelectorAll('.w');
    if (!name || !price || !tail || !words.length) continue;

    name.style.fontSize = '';
    tail.style.minWidth = '';

    const base = parseFloat(getComputedStyle(name).fontSize);
    const style = getComputedStyle(words[0]);
    const space = parseFloat(style.marginRight) || 0;

    // Word widths do not depend on where the row happens to wrap, so this is
    // the width the name would need on a single line.
    let natural = 0;
    for (const word of words) natural += word.getBoundingClientRect().width + space;

    const room = main.clientWidth - price.getBoundingClientRect().width - LEADER_MIN;
    if (!natural || room <= 0) continue;

    const scale = room / natural;
    if (scale >= 1) continue;

    // Shrink only as far as the floor. Past that, leave the name at full size
    // and let the row wrap: a second line with a proper run of dots reads
    // better than one line with three dots squeezed into it.
    const size = base * scale;
    if (size >= NAME_FLOOR) {
      name.style.fontSize = size.toFixed(2) + 'px';
    } else if (words.length > 1) {
      // Give the tail a width the line cannot satisfy, so it wraps down to a
      // line of its own and the dots have room to run.
      const lastWord = words[words.length - 1].getBoundingClientRect().width;
      tail.style.minWidth =
        Math.round(lastWord + LEADER_MIN + price.getBoundingClientRect().width) + 'px';
    }
  }
}

let fitPending;
window.addEventListener('resize', () => {
  clearTimeout(fitPending);
  fitPending = setTimeout(fitLeaders, 120);
});

/* ---------- menu ---------- */

// What the menu looks like, boiled down. If this is unchanged, the rows on
// screen are still right and only the counts need refreshing.
function menuShape(menu) {
  return JSON.stringify(menu.map((s) => [
    s.section,
    s.groups.map((g) => [g.title, g.items.map((i) => [i.id, i.name, i.price, i.desc || ''])])
  ]));
}

let drawnShape = '';

function drawMenu(data) {
  el('menuBody').innerHTML = data.menu.map((section) => `
    <h2 class="section-title">${section.section}</h2>
    ${section.groups.map((group) => `
      ${group.title ? `<h3 class="group-title">${group.title}</h3>` : ''}
      ${group.items.map((item) => `
        <div class="row">
          <div class="row-line">
            <div class="row-main">
              <p class="row-name">${nameRow(item.name, money(item.price))}</p>
            </div>
            <div class="row-ctl" data-id="${item.id}"></div>
          </div>
          ${item.desc ? `<p class="row-desc">${item.desc}</p>` : ''}
        </div>
      `).join('')}
    `).join('')}
  `).join('');

  renderSite(data.site || {});
  fitLeaders();
}

// Reads the menu and brings the page into line with it: the rows are redrawn
// only if the menu itself changed, so a passing count update never disturbs a
// cart someone is in the middle of filling.
async function syncMenu() {
  const res = await fetch('/api/menu');
  if (!res.ok) return;
  const data = await res.json();

  state.currency = data.currency;
  state.demo = data.demo;
  state.stripeKey = data.stripeKey || '';
  state.items = Object.fromEntries(
    data.menu.flatMap((s) => s.groups.flatMap((g) => g.items.map((i) => [i.id, i])))
  );

  const shape = menuShape(data.menu);
  if (shape !== drawnShape) {
    drawnShape = shape;
    drawMenu(data);
  }

  // An item can leave the menu, or sell down, while a cart is open.
  for (const [id, qty] of [...state.cart]) {
    const item = state.items[id];
    const left = item?.available ?? 0;
    if (!item || left <= 0) state.cart.delete(id);
    else if (qty > left) state.cart.set(id, left);
  }

  persist();
  renderCart();
}

async function loadMenu() {
  await syncMenu();

  el('menuBody').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-delta]');
    if (!btn) return;
    const id = btn.closest('.row-ctl').dataset.id;
    setQty(id, (state.cart.get(id) || 0) + Number(btn.dataset.delta));
  });

  watchForChanges();
}

/* ---------- staying current ----------
   The server holds a stream open and says when the menu or the counts change,
   so an edit on the staff page lands here at once. The poll is the belt to
   that brace: it covers a dropped stream, a sleeping phone, or a network that
   will not carry events. */

function watchForChanges() {
  try {
    const stream = new EventSource('/api/events');
    stream.addEventListener('menu', () => syncMenu());
  } catch { /* no EventSource; the poll below carries it */ }

  setInterval(() => { if (!document.hidden) syncMenu(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncMenu(); });
  window.addEventListener('focus', () => syncMenu());
}

// Each menu row shows a plus until the item is in the cart, then a stepper with
// the quantity. Called on every cart change so the two stay in step.
function renderMenuQuantities() {
  for (const ctl of document.querySelectorAll('.row-ctl')) {
    const id = ctl.dataset.id;
    const item = state.items[id];
    const qty = state.cart.get(id) || 0;
    const left = item.available ?? 0;
    const name = item.name;

    // key includes the limit so a row redraws when stock changes under it
    const key = `${qty}/${left}`;
    if (ctl.dataset.key === key) continue;
    const isNew = qty > 0 && (ctl.dataset.key || '').startsWith('0/');
    ctl.dataset.key = key;

    if (left <= 0 && qty === 0) {
      ctl.innerHTML = '<span class="sold-out">sold out :(</span>';
      continue;
    }

    if (qty === 0) {
      ctl.innerHTML = `<button class="add" data-delta="1" aria-label="Add ${name} to cart">+</button>`;
      continue;
    }

    const atLimit = qty >= left;
    ctl.innerHTML = `
      <div class="row-qty${isNew ? ' pop' : ''}">
        <button data-delta="-1" aria-label="Remove one ${name}">&minus;</button>
        <span aria-live="polite" aria-label="${qty} of ${left} in cart">${qty}</span>
        <button data-delta="1" aria-label="Add one ${name}"${atLimit ? ' disabled aria-disabled="true"' : ''}>+</button>
      </div>`;
  }

  renderStockNotes();
  fitLeaders();
}

// A quiet line under an item once it is into single figures, or all of them are
// in the cart already, so the disabled plus is never a mystery.
function renderStockNotes() {
  for (const row of document.querySelectorAll('.row')) {
    const id = row.querySelector('.row-ctl').dataset.id;
    const item = state.items[id];
    const left = item.available ?? 0;
    const qty = state.cart.get(id) || 0;
    let note = '';

    if (left > 0 && qty >= left) note = `that is all ${left} we have`;
    else if (left > 0 && left < 10) note = `only ${left} left!`;

    let el = row.querySelector('.row-stock');
    if (!note) { if (el) el.remove(); continue; }
    if (!el) {
      el = document.createElement('p');
      el.className = 'row-stock';
      row.appendChild(el);
    }
    if (el.textContent !== note) el.textContent = note;
  }
}

// Shop details come from SITE in menu.js. Anything left blank renders nothing,
// so the page never shows hours or a policy that were never filled in.
function renderSite(site) {
  const put = (id, text) => { el(id).textContent = text || ''; };
  put('footHours', site.hours);
  put('footAddress', site.address);
  put('footEmail', site.email);

  el('footnote').hidden = !site.footnote;
  if (site.footnote) el('footnote').textContent = `* ${site.footnote}`;
}

/* ---------- cart ---------- */

function setQty(id, qty) {
  const left = state.items[id]?.available ?? 0;
  const capped = Math.min(qty, left);
  if (capped <= 0) state.cart.delete(id);
  else state.cart.set(id, capped);
  persist();
  renderCart();
}

function cartTotal() {
  let sum = 0;
  for (const [id, qty] of state.cart) sum += state.items[id].price * qty;
  return sum;
}

function cartCount() {
  let n = 0;
  for (const qty of state.cart.values()) n += qty;
  return n;
}

function renderCart() {
  renderMenuQuantities();

  const count = cartCount();
  const total = cartTotal();

  el('cartCount').textContent = `${count} ${count === 1 ? 'item' : 'items'}`;
  el('cartTotal').textContent = money(total);
  el('sheetTotal').textContent = money(total);
  el('payBtn').disabled = count === 0;
  updatePayState();
  updateCartBar();

  if (count === 0) {
    el('cartList').innerHTML = '<p class="empty">nothing here yet</p>';
    return;
  }

  el('cartList').innerHTML = [...state.cart].map(([id, qty]) => {
    const item = state.items[id];
    return `
      <div class="cart-line">
        <div>
          <div class="cart-line-name">${item.name}</div>
          <div class="cart-line-sub">${money(item.price)} each &middot; ${money(item.price * qty)}</div>
        </div>
        <div class="qty">
          <button data-id="${id}" data-delta="-1" aria-label="Remove one ${item.name}">&minus;</button>
          <span>${qty}</span>
          <button data-id="${id}" data-delta="1" aria-label="Add one ${item.name}">+</button>
        </div>
      </div>`;
  }).join('');
}

el('cartList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-delta]');
  if (!btn) return;
  const id = btn.dataset.id;
  setQty(id, (state.cart.get(id) || 0) + Number(btn.dataset.delta));
});

function persist() {
  try {
    localStorage.setItem('es30.cart', JSON.stringify([...state.cart]));
  } catch { /* private browsing, carry on without saving */ }
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem('es30.cart') || '[]');
    for (const [id, qty] of saved) {
      // stock may have moved since this cart was saved
      const left = state.items[id]?.available ?? 0;
      const keep = Math.min(qty, left);
      if (keep > 0) state.cart.set(id, keep);
    }
  } catch { /* nothing saved */ }
}

// The cart pill belongs to the menu screen only.
function onMenuScreen() {
  return document.querySelector('.splash').classList.contains('gone');
}

function updateCartBar() {
  const showing = cartCount() > 0 && onMenuScreen();
  el('cartBar').classList.toggle('show', showing);
  // Only hold room at the foot of the menu while the pill is there to clear.
  el('menu').classList.toggle('has-cart', showing);
}

// The Checkout button only takes its solid colour once the order has a name.
function updatePayState() {
  el('payBtn').classList.toggle('ready', el('name').value.trim().length > 0);
}

el('name').addEventListener('input', updatePayState);

/* ---------- sheet ---------- */

function openSheet() {
  el('sheet').classList.add('open');
  el('scrim').classList.add('open');
}

function closeSheet() {
  el('sheet').classList.remove('open');
  el('scrim').classList.remove('open');
}

el('cartBar').addEventListener('click', openSheet);
el('closeSheet').addEventListener('click', closeSheet);
el('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

// Swap the opening screen out for the menu. The menu rises into place, so it
// still reads as moving down the card without leaving the splash behind it.
el('viewMenu').addEventListener('click', () => {
  document.querySelector('.splash').classList.add('gone');
  el('menu').classList.add('enter');
  el('scroller').scrollTop = 0;
  updateCartBar();
});

// Pull the current counts without redrawing the whole menu.
async function refreshAvailability() {
  try {
    await syncMenu();
  } catch { /* offline; leave the page as it is */ }
}

/* ---------- checkout ---------- */

/* ---------- paying, without leaving the cafe ----------
   Stripe draws its card form into the card itself. Stripe sends the customer
   to the order-number screen when the payment is done, so the only page that
   changes is the one at the end. */

let checkoutWidget;

async function openPayScreen(clientSecret) {
  const screen = el('payScreen');
  el('payTotal').textContent = `Total ${el('sheetTotal').textContent}`;

  const stripe = Stripe(state.stripeKey);
  checkoutWidget = await stripe.initEmbeddedCheckout({ clientSecret });

  screen.hidden = false;
  checkoutWidget.mount('#stripeMount');
}

// Leaving the payment screen destroys the form: Stripe only allows one mounted
// at a time, and the next attempt needs a fresh session anyway.
function closePayScreen() {
  if (checkoutWidget) {
    checkoutWidget.destroy();
    checkoutWidget = undefined;
  }
  el('payScreen').hidden = true;
  el('payBtn').disabled = false;
  el('payBtn').textContent = 'Checkout';
}

el('closePay').addEventListener('click', () => {
  closePayScreen();
  // The cart was cleared when the session opened; rebuild it from the order
  // that is still on screen so nothing is lost by backing out.
  renderCart();
});


/* ---------- checkout, simulated ----------
   The real site posts the cart to the server, which re-checks stock, prices the
   order and hands off to Stripe. This build does it in the page. */

let previewOrders = 0;

const esc = (str) => String(str).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const arcSize = (text) => Math.max(13, Math.min(30, Math.round(368 / (text.length * 0.56))));

const greetingArc = (name) => {
  const text = `Thank you, ${esc(name)}!`;
  return `
    <svg class="ticket-arc" viewBox="0 0 400 92" role="img" aria-label="${text}">
      <path id="greetArc" d="M18 84 Q200 24 382 84" fill="none"/>
      <text text-anchor="middle" font-size="${arcSize(text)}">
        <textPath href="#greetArc" startOffset="50%">${text}</textPath>
      </text>
    </svg>`;
};

el('checkoutForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = el('name').value.trim();
  el('err').textContent = '';
  if (!name) { el('err').textContent = 'Please enter a name for the order.'; return; }

  const lines = [...state.cart].map(([id, qty]) => {
    const item = state.items[id];
    return { id, name: item.name, qty, total: item.price * qty };
  });

  // Take the stock, the way the server would once the order is paid.
  for (const line of lines) {
    state.items[line.id].available = Math.max(0, state.items[line.id].available - line.qty);
  }

  showTicket({ orderNumber: ++previewOrders, name, lines, total: cartTotal() });
});

function showTicket(order) {
  el('confirmScreen').innerHTML = `
    ${greetingArc(order.name)}
    <p class="ticket-label">order</p>
    <p class="order-number"><span class="hash">#</span>${order.orderNumber}</p>
    <p class="ticket-note">We will call this number when it is ready. Please have this screen visible to confirm your order.</p>
    <ul class="ticket-items">
      ${order.lines.map((l) => `<li><span>${l.qty} &times; ${esc(l.name)}</span><span>${money(l.total)}</span></li>`).join('')}
    </ul>
    <div class="ticket-total"><span>Total</span><span>${money(order.total)}</span></div>
    <form class="signup" id="signup" novalidate>
      <label class="signup-line" for="email">Want $5 on ES30 Cafe? Enter your email for a chance to win!</label>
      <div class="signup-row">
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@college.harvard.edu">
        <button type="submit" class="signup-go">Enter</button>
      </div>
      <p class="field-note" id="emailNote"></p>
    </form>`;

  // No server in this build, so the entry is acknowledged and goes no further.
  el('confirmScreen').querySelector('#signup').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = el('email').value.trim();
    const note = el('emailNote');
    note.textContent = '';
    if (!email) { note.textContent = 'Pop your email in first.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      note.textContent = 'That does not look like an email address.';
      return;
    }
    e.target.innerHTML =
      '<p class="signup-line">Good luck! Check your email next Wednesday at 10am to see if you are the lucky winner!</p>';
  });

  el('confirmScreen').hidden = false;
}

buildRibbons();
loadMenu().then(() => { restore(); renderCart(); });

</script>
