<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ES30 Cafe</title>
<meta name="theme-color" content="#4C9DB0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="card">
    <div class="card-scroll" id="scroller">

      <!-- ---------- screen one: splash ---------- -->
      <section class="screen splash">
        <span class="ribbon" data-label="ES30 Cafe"></span>

        <svg class="art art-splash" viewBox="46 62 252 184" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Drawn back to front. Closed shapes are filled with the card color so
               each object hides the lines of whatever sits behind it. -->

          <!-- folded napkin -->
          <path fill="var(--cream)" d="M50 210 L80 180 L140 174 L206 182 L262 204 L232 234 L120 238 L64 228 Z"/>
          <path d="M80 180 L104 204"/>

          <!-- alarm clock: a ring with a coil inside, and two shake marks -->
          <path d="M62 110l-10-9M80 98l-6-12"/>
          <circle cx="100" cy="148" r="33" fill="var(--cream)"/>
          <circle cx="100" cy="148" r="24"/>
          <path d="M100 148c0-5 7-5 7 0 0 9-13 9-13 0 0-13 19-13 19 0 0 16-24 16-24 0"/>

          <!-- moka pot: tall tapered base, waist, upper chamber flaring out to a
               faceted dome and knob, handle on the right -->
          <path d="M262 110 L284 106 L292 120 L286 140 L272 150 L258 148"/>
          <path fill="var(--cream)" d="M204 222 L268 222 L258 150 L214 150 Z"/>
          <path d="M224 150l-6 72M248 150l6 72"/>
          <path fill="var(--cream)" d="M214 150 L258 150 L264 106 L208 106 Z"/>
          <path d="M214 150H258"/>
          <path d="M210 114l-14 6 15 6"/>
          <path fill="var(--cream)" d="M208 106 L216 90 L226 84 L246 84 L256 90 L264 106 Z"/>
          <path d="M204 106H268"/>
          <path d="M226 84l1 22M246 84l-1 22"/>
          <path fill="var(--cream)" d="M228 72 L244 72 L247 78 L244 84 L228 84 L225 78 Z"/>

          <!-- croissant, in front -->
          <path fill="var(--cream)" d="M84 216C78 158 188 158 182 216C174 205 152 198 133 198C114 198 92 205 84 216Z"/>
          <path d="M114 174v24M152 174v24"/>
        </svg>

        <button class="ghost-btn" id="viewMenu">View Menu</button>
      </section>

      <!-- ---------- screen two: the menu ---------- -->
      <section class="screen menu" id="menu">
        <div id="menuBody"></div>

        <p class="footnote" id="footnote" hidden></p>

        <footer class="foot">
          <p class="foot-line" id="footHours"></p>
          <p class="foot-line" id="footAddress"></p>
          <p class="foot-line" id="footEmail"></p>
        </footer>
      </section>

    </div>

    <!-- ---------- cart, pinned inside the card ---------- -->
    <button class="cart-bar" id="cartBar">
      <span class="cart-bar-summary">
        <span id="cartCount">0 items</span>
        <span id="cartTotal">$0.00</span>
      </span>
      <span class="cart-bar-cta">View cart</span>
    </button>

    <div class="sheet-scrim" id="scrim"></div>

    <aside class="sheet" id="sheet" aria-label="Your cart">
      <div class="sheet-top">
        <h3>Your order</h3>
        <button class="close" id="closeSheet" aria-label="Close">&times;</button>
      </div>

      <div class="cart-list" id="cartList"></div>

      <div class="totals">
        <span>Total</span>
        <span id="sheetTotal">$0.00</span>
      </div>

      <form id="checkoutForm" novalidate>
        <label for="name">Name for the order</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="First and Last Name">
        <p class="err" id="err"></p>
        <button class="pay" type="submit" id="payBtn">Checkout</button>
      </form>
    </aside>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
