<!doctype html>
<meta charset="utf-8">
<title>The ES30 Cafe Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --hand: "Architects Daughter", cursive; --banner: "Archivo Narrow", sans-serif;
          --cream: #FFEBAF; --ink: #2F6A79; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; background: var(--cream); color: var(--ink);
         font-family: var(--hand); -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; padding: 52px 64px 44px; }

  .head { font-family: var(--banner); font-size: 78px; text-transform: uppercase;
          text-align: center; line-height: 1; }
  .deck { font-size: 32px; text-align: center; margin-top: 12px; }

  /* The rail is the spine: every stop hangs off the same line. */
  .track { height: 860px; display: flex; align-items: center; margin-top: 18px; position: relative; }
  /* The spine runs straight, forks where the company did, and rejoins at the merger. */
  .rail { position: absolute; inset: 0; width: 1920px; height: 860px; left: -64px;
          stroke: var(--ink); stroke-width: 5; fill: none; }
  .rail path { opacity: 0.35; }
  .stops { display: flex; width: 100%; position: relative; }
  /* Three rows: label above, dot on the rail, label below. */
  .stop { flex: 1; height: 860px; display: grid; grid-template-rows: 410px 40px 410px;
          justify-items: center; padding: 0 44px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--cream);
         border: 5px solid var(--ink); }
  .stop.now .dot, .stop.forks .dot { background: var(--ink); }

  /* Alternating sides keep the labels off each other at this density. */
  .above { grid-row: 1; align-self: end; padding-bottom: 26px; text-align: center; }
  .below { grid-row: 3; align-self: start; padding-top: 26px; text-align: center; }
  .dot { grid-row: 2; align-self: center; }
  .when { font-family: var(--banner); font-size: 25px; text-transform: uppercase;
          letter-spacing: 0.08em; opacity: 0.8; }
  .what { font-family: var(--banner); font-size: 32px; text-transform: uppercase;
          line-height: 1.06; margin-top: 4px; }
  .note { font-size: 24px; line-height: 1.32; margin-top: 10px; }
  .lesson { font-size: 26px; line-height: 1.3; margin-top: 10px; opacity: 0.85;
            -webkit-text-stroke: 0.5px var(--ink); }

  /* The two marks ride the branches, one per line. */
  .brand { position: absolute; left: 1322px; width: 168px;
           transform: translate(-50%, -50%); }
  .brand.plated { background: var(--ink); padding: 5px 9px; border-radius: 8px;
                  width: 184px; }
  .foot { text-align: center; font-size: 28px; margin-top: auto;
          -webkit-text-stroke: 0.6px var(--ink); }
</style>

<h1 class="head">The ES30 Cafe arc</h1>

<div class="track">
  <svg class="rail" viewBox="0 0 1920 860">
    <path d="M 48 430 H 1184"/>
    <path d="M 1184 430 C 1304 430 1300 338 1408 338 C 1516 338 1512 430 1632 430"/>
    <path d="M 1184 430 C 1304 430 1300 522 1408 522 C 1516 522 1512 430 1632 430"/>
    <path d="M 1632 430 H 1872"/>
  </svg>
  <img class="brand" style="top: 392px" src="../public/banner.png" alt="ES30 Cafe">
  <img class="brand plated" style="top: 468px" src="../public/cafe-es30-banner.png" alt="Cafe ES30">
  <div class="stops" id="stops"></div>
</div>


<script>
  // Each stop carries the decision and the lesson it cost us to learn.
  const STOPS = [
    ['', 'Problem<br>identification &amp; GTM', 'Lecture runs 12 to 2:45, peak lunch hours, so there is an opportunity to sell snacks during the break. Partner with Professor Rascoff to lead GTM.', ''],
    ['', 'Product improvement', 'Chamal and Sheldon called the cafe a great example of trying to &ldquo;learn as much as you can as quickly as you can,&rdquo; so we changed our pricing, menu offerings, and customer experience to improve our margins.', ''],
    ['', 'Co-founder breakup', 'ES30 Cafe and Cafe ES30. Thanks to an early lesson from David Willabrand, we did implement a vesting schedule, so we were able to avoid the troubles Garrett experienced at Queue.', ''],
    ['', 'Together again', 'No black swan event, but two weeks of adversity. Anna Berger&rsquo;s honesty about navigating difficult co-founder dynamics stuck with us, so we underwent executive coaching and have merged back together. Free stickers and Insomnia Cookies as a sign of unity.', '']
  ];

  stops.innerHTML = STOPS.map(([when, what, note, lesson], i) => `
    <div class="stop${i === STOPS.length - 1 ? ' now' : ''}${i === 2 ? ' forks' : ''}">
      <div class="${i % 2 ? 'below' : 'above'}">
        <p class="what">${what}</p>
        <p class="note">${note}</p>
      </div>
      <span class="dot"></span>
    </div>`).join('');
</script>
