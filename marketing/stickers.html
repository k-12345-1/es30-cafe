<!doctype html>
<meta charset="utf-8">
<title>ES30 Cafe stickers</title>
<style>
  :root { --cream: #FFEBAF; --ink: #2F6A79; }
  * { box-sizing: border-box; margin: 0; }

  /* US Letter at 96 pixels to the inch: 2in squares butted together, four
     across and five down, so every cut is shared with its neighbour. */
  body {
    width: 816px; height: 1056px; background: #fff;
    display: grid; grid-template-columns: repeat(4, 192px);
    grid-auto-rows: 192px; justify-content: center; align-content: center;
  }

  .sticker {
    width: 192px; height: 192px;
    background: var(--cream);
    outline: 1px dashed rgba(47, 106, 121, 0.4);   /* the cut line, shared between squares */
    outline-offset: -1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 14px;
  }

  .banner { width: 150px; }
  .goods { width: 62px; }
</style>

<script>
  const one = `
    <div class="sticker">
      <img class="banner" src="../public/banner.png" alt="ES30 Cafe">
      <img class="goods" src="../public/drink.png" alt="">
    </div>`;
  document.write(one.repeat(20));
</script>
