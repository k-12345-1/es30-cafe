# One-click deploy blueprint for Render.
#
# The stock counts, orders and giveaway entries are JSON files on disk, so the
# service needs a disk that survives restarts. A platform with an ephemeral
# filesystem would lose them on every deploy.
services:
  - type: web
    name: es30-cafe
    runtime: node
    region: virginia      # closest of Render's regions to Cambridge
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/menu
    disk:
      name: es30-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: TZ
        value: America/New_York   # the cafe's day, for order numbers and takings
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_TOKEN
        sync: false        # set this in the Render dashboard, never in the repo
      - key: STRIPE_SECRET_KEY
        sync: false        # leave unset to run in demo mode
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false        # pk_... — with it set, the card form opens in the cafe
      # PUBLIC_URL is optional: the app falls back to RENDER_EXTERNAL_URL,
      # which Render fills in with the live address of this service.
