<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order confirmed &middot; ES30 Cafe</title>
<meta name="theme-color" content="#4C9DB0">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="card">
    <div class="confirm" id="ticket">
      <p class="ticket-label">confirming your order</p>
    </div>
  </div>
</div>

<!-- Comes up a few seconds after the receipt. -->
<div class="max-wrap" id="maxOffer" hidden>
  <div class="max-card" role="dialog" aria-modal="true" aria-labelledby="maxTitle">
    <h2 class="max-title" id="maxTitle">WaiTER MAX</h2>
    <p class="max-line">Want a free snack and drink every class? Pay $50 for:</p>
    <ul class="max-list">
      <li>express lane during the 10-minute break</li>
      <li>1 FREE bottle of WaiTER</li>
      <li>1 FREE pack of Oreos</li>
    </ul>
    <p class="max-every">every class</p>
    <div class="max-actions">
      <button type="button" class="max-go" id="maxGo">Sign me up</button>
      <button type="button" class="max-close" id="maxClose">No thanks</button>
    </div>
    <p class="max-note" id="maxNote"></p>
  </div>
</div>

<script>
const esc = (str) => String(str).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The greeting is set on an arc. Long names get a smaller size so the text
// keeps to the curve instead of running off the end of it.
const arcSize = (text) => Math.max(13, Math.min(30, Math.round(368 / (text.length * 0.56))));

const greetingArc = (name) => {
  const text = `Thank you, ${esc(name)}!`;
  return `
    <svg class="ticket-arc" viewBox="0 0 400 92" role="img" aria-label="${text}">
      <path id="greetArc" d="M18 84 Q200 24 382 84" fill="none"/>
      <text text-anchor="middle" font-size="${arcSize(text)}">
        <textPath href="#greetArc" startOffset="50%">${text}</textPath>
      </text>
    </svg>`;
};

const money = (cents, cur) =>
  new Intl.NumberFormat('en-US', { style: 'currency', currency: cur.toUpperCase() }).format(cents / 100);

async function load() {
  const sessionId = new URLSearchParams(location.search).get('session_id');
  if (!sessionId) return fail('no order found');

  // Stripe can redirect a moment before the payment is marked paid, so retry briefly.
  for (let attempt = 0; attempt < 6; attempt++) {
    const res = await fetch('/api/order?session_id=' + encodeURIComponent(sessionId));
    if (res.ok) return render(await res.json());
    if (res.status !== 402) break;
    await new Promise((r) => setTimeout(r, 900));
  }

  fail('we could not confirm this order');
}

function fail(message) {
  document.getElementById('ticket').innerHTML =
    `<p class="ticket-label">${message}</p>
     <a class="back" href="/">back to the menu</a>`;
}

function render(order) {
  document.getElementById('ticket').innerHTML = `
    ${greetingArc(order.name)}
    <p class="ticket-label">order</p>
    <p class="order-number"><span class="hash">#</span>${order.orderNumber}</p>
    <p class="ticket-note">We will call this number when it is ready. Please have this screen visible to confirm your order.</p>
    <ul class="ticket-items">
      ${order.lines.map((l) => `<li><span>${l.qty} &times; ${l.name}</span><span>${money(l.total, order.currency)}</span></li>`).join('')}
    </ul>
    <div class="ticket-total"><span>Total</span><span>${money(order.total, order.currency)}</span></div>
    <form class="signup" id="signup" novalidate>
      <label class="signup-line" for="email">Want $5 on ES30 Cafe? Enter your email for a chance to win!</label>
      <div class="signup-row">
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@college.harvard.edu">
        <button type="submit" class="signup-go" data-armed="false">Enter</button>
      </div>
      <p class="field-note" id="emailNote"></p>
    </form>`;

  // The Enter button stays quiet until the field holds something that could be
  // an address, so it never invites a tap that can only fail.
  const emailField = document.getElementById('email');
  const goButton = document.querySelector('.signup-go');
  const arm = () => {
    goButton.dataset.armed = emailField.value.includes('@') ? 'true' : 'false';
  };
  emailField.addEventListener('input', arm);
  arm();

  document.getElementById('signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const note = document.getElementById('emailNote');
    note.textContent = '';

    // Checked here rather than left to the browser, whose grey bubble would
    // look nothing like the rest of the page.
    if (!email) {
      note.textContent = 'Enter your email.';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      note.textContent = 'That does not look like an email address.';
      return;
    }
    try {
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
    } catch { /* the order is already placed; the entry is the only thing lost */ }
    document.getElementById('signup').innerHTML =
      '<p class="signup-line">Good luck! Check your email next Wednesday at 10am to see if you are the lucky winner!</p>';
  });
  document.title = `Order ${order.orderNumber} · ES30 Cafe`;
  offerMax(order);
}

/* ---------- the WaiTER MAX card ----------
   Shown a few seconds after the receipt has settled, so the order number is
   read first, and only once per order however often the page is opened. */

const MAX_DELAY_MS = 3_000;

function offerMax(order) {
  // Keyed by the order's own session, so next week's order number two still
  // sees it, and a reload of this one does not.
  const seen = 'es30.max.' + (new URLSearchParams(location.search).get('session_id') || order.orderNumber);
  try { if (localStorage.getItem(seen)) return; } catch { /* private window */ }

  setTimeout(() => {
    const card = document.getElementById('maxOffer');
    if (!card) return;
    try { localStorage.setItem(seen, '1'); } catch { /* private window */ }

    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('up'));
    document.getElementById('maxClose').focus();
  }, MAX_DELAY_MS);
}

function hideMax() {
  const card = document.getElementById('maxOffer');
  card.classList.remove('up');
  setTimeout(() => { card.hidden = true; }, 220);
}

document.getElementById('maxClose').addEventListener('click', hideMax);

// Signing up puts the name from this order on the staff's list. The $50 is
// taken at the counter, so nothing is charged here.
document.getElementById('maxGo').addEventListener('click', async () => {
  const button = document.getElementById('maxGo');
  const note = document.getElementById('maxNote');
  button.disabled = true;
  note.textContent = '';

  try {
    const res = await fetch('/api/waiter-max', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: new URLSearchParams(location.search).get('session_id') })
    });
    if (!res.ok) throw new Error((await res.json()).error || 'That did not send.');
    document.querySelector('.max-actions').remove();
    note.textContent = 'You are on the list. Pay $50 at the counter and it starts today.';
    setTimeout(hideMax, 3_600);
  } catch (err) {
    button.disabled = false;
    note.textContent = err.message;
  }
});
document.getElementById('maxOffer').addEventListener('click', (event) => {
  if (event.target.id === 'maxOffer') hideMax();     // the dimmed ground around it
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !document.getElementById('maxOffer').hidden) hideMax();
});

load();
</script>
</body>
</html>
