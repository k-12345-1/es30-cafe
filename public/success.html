<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order confirmed &middot; ES30 Cafe</title>
<meta name="theme-color" content="#4C9DB0">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="confirm" id="ticket">
      <p class="ticket-label">confirming your order</p>
    </div>
  </div>
</div>

<!-- Comes up a few seconds after the receipt. -->
<div class="max-wrap" id="maxOffer" hidden>
  <div class="max-card" role="dialog" aria-modal="true" aria-labelledby="maxTitle">
    <h2 class="max-title" id="maxTitle">WaiTER MAX</h2>
    <p class="max-line">One time $50 payment includes:</p>
    <ul class="max-list">
      <li>WaiTER MAX express lane during the 10-minute break</li>
      <li>1 FREE bottle of WaiTER</li>
      <li>1 FREE pack of Oreos</li>
    </ul>
    <div class="max-actions">
      <button type="button" class="max-go" id="maxGo">Sign me up</button>
      <button type="button" class="max-close" id="maxClose">No thanks</button>
    </div>

    <!-- Revealed by Sign me up: the name on the pass, then Stripe's own form. -->
    <form class="max-form" id="maxForm" hidden novalidate>
      <label class="max-label" for="maxName">Name on the pass</label>
      <input type="text" id="maxName" maxlength="60" autocomplete="name"
             placeholder="First and Last Name">
      <button type="submit" class="max-go" id="maxPay">Pay $50</button>
      <button type="button" class="max-close" id="maxBack">Back</button>
    </form>

    <div class="max-pay" id="maxPayMount" hidden></div>
    <p class="max-note" id="maxNote"></p>
  </div>
</div>

<script>
const esc = (str) => String(str).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The greeting is set on an arc. Long names get a smaller size so the text
// keeps to the curve instead of running off the end of it.
const arcSize = (text) => Math.max(13, Math.min(30, Math.round(368 / (text.length * 0.56))));

const greetingArc = (name) => {
  const text = `Thank you, ${esc(name)}!`;
  return `
    <svg class="ticket-arc" viewBox="0 0 400 92" role="img" aria-label="${text}">
      <path id="greetArc" d="M18 84 Q200 24 382 84" fill="none"/>
      <text text-anchor="middle" font-size="${arcSize(text)}">
        <textPath href="#greetArc" startOffset="50%">${text}</textPath>
      </text>
    </svg>`;
};

const money = (cents, cur) =>
  new Intl.NumberFormat('en-US', { style: 'currency', currency: cur.toUpperCase() }).format(cents / 100);

async function load() {
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');

  // Coming back from paying for a pass rather than from an order: the card
  // above says everything, so the page behind it stays quiet.
  if (!sessionId && params.get('max_session_id')) {
    document.getElementById('ticket').innerHTML =
      '<a class="back" href="/">back to the menu</a>';
    return;
  }

  if (!sessionId) return fail('no order found');

  // Stripe can redirect a moment before the payment is marked paid, so retry briefly.
  for (let attempt = 0; attempt < 6; attempt++) {
    const res = await fetch('/api/order?session_id=' + encodeURIComponent(sessionId));
    if (res.ok) return render(await res.json());
    if (res.status !== 402) break;
    await new Promise((r) => setTimeout(r, 900));
  }

  fail('we could not confirm this order');
}

function fail(message) {
  document.getElementById('ticket').innerHTML =
    `<p class="ticket-label">${message}</p>
     <a class="back" href="/">back to the menu</a>`;
}

function render(order) {
  document.getElementById('ticket').innerHTML = `
    ${greetingArc(order.name)}
    <p class="ticket-label">order</p>
    <p class="order-number"><span class="hash">#</span>${order.orderNumber}</p>
    <p class="ticket-note">We will call this number when it is ready. Please have this screen visible to confirm your order.</p>
    <ul class="ticket-items">
      ${order.lines.map((l) => `<li><span>${l.qty} &times; ${l.name}</span><span>${money(l.total, order.currency)}</span></li>`).join('')}
    </ul>
    <div class="ticket-total"><span>Total</span><span>${money(order.total, order.currency)}</span></div>
    <form class="signup" id="signup" novalidate>
      <label class="signup-line" for="email">Want $5 on ES30 Cafe? Enter your email for a chance to win!</label>
      <div class="signup-row">
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@college.harvard.edu">
        <button type="submit" class="signup-go" data-armed="false">Enter</button>
      </div>
      <p class="field-note" id="emailNote"></p>
    </form>`;

  // The Enter button stays quiet until the field holds something that could be
  // an address, so it never invites a tap that can only fail.
  const emailField = document.getElementById('email');
  const goButton = document.querySelector('.signup-go');
  const arm = () => {
    goButton.dataset.armed = emailField.value.includes('@') ? 'true' : 'false';
  };
  emailField.addEventListener('input', arm);
  arm();

  document.getElementById('signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const note = document.getElementById('emailNote');
    note.textContent = '';

    // Checked here rather than left to the browser, whose grey bubble would
    // look nothing like the rest of the page.
    if (!email) {
      note.textContent = 'Enter your email.';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      note.textContent = 'That does not look like an email address.';
      return;
    }
    try {
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
    } catch { /* the order is already placed; the entry is the only thing lost */ }
    document.getElementById('signup').innerHTML =
      '<p class="signup-line">Good luck! Check your email next Wednesday at 10am to see if you are the lucky winner!</p>';
  });
  document.title = `Order ${order.orderNumber} · ES30 Cafe`;
  offerMax(order);
}

/* ---------- the WaiTER MAX card ----------
   Shown a few seconds after the receipt has settled, so the order number is
   read first, and only once per order however often the page is opened. */

const MAX_DELAY_MS = 3_000;

function offerMax(order) {
  // Keyed by the order's own session, so next week's order number two still
  // sees it, and a reload of this one does not.
  const seen = 'es30.max.' + (new URLSearchParams(location.search).get('session_id') || order.orderNumber);
  try { if (localStorage.getItem(seen)) return; } catch { /* private window */ }

  setTimeout(() => {
    const card = document.getElementById('maxOffer');
    if (!card) return;
    try { localStorage.setItem(seen, '1'); } catch { /* private window */ }

    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('up'));
    document.getElementById('maxClose').focus();
  }, MAX_DELAY_MS);
}

function hideMax() {
  const card = document.getElementById('maxOffer');
  card.classList.remove('up');
  setTimeout(() => { card.hidden = true; }, 220);
}

document.getElementById('maxClose').addEventListener('click', hideMax);

/* Signing up is a payment: the name goes on the pass, then Stripe's own card
   form opens inside this card. Nobody reaches the staff's list without it. */

let maxWidget;

document.getElementById('maxGo').addEventListener('click', () => {
  document.querySelector('.max-actions').hidden = true;
  document.getElementById('maxForm').hidden = false;
  document.getElementById('maxName').focus();
});

document.getElementById('maxBack').addEventListener('click', () => {
  document.getElementById('maxForm').hidden = true;
  document.querySelector('.max-actions').hidden = false;
  document.getElementById('maxNote').textContent = '';
});

document.getElementById('maxForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const name = document.getElementById('maxName').value.replace(/\s+/g, ' ').trim();
  const pay = document.getElementById('maxPay');
  const note = document.getElementById('maxNote');
  note.textContent = '';

  // Both halves of a name, checked here so the wait for Stripe is never wasted.
  if (!/^[^\s]+(\s+[^\s]+)+$/.test(name)) {
    note.textContent = 'Please enter your first and last name.';
    return;
  }

  pay.disabled = true;
  pay.textContent = 'Opening payment';

  try {
    const res = await fetch('/api/waiter-max/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, sessionId: new URLSearchParams(location.search).get('session_id') })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not open the payment form.');

    if (data.demo) return showMaxDone(name);
    if (data.url) return (window.location.href = data.url);

    document.getElementById('maxForm').hidden = true;
    document.getElementById('maxPayMount').hidden = false;
    const stripe = Stripe(data.publishableKey);
    maxWidget = await stripe.initEmbeddedCheckout({ clientSecret: data.clientSecret });
    maxWidget.mount('#maxPayMount');
  } catch (err) {
    pay.disabled = false;
    pay.textContent = 'Pay $50';
    note.textContent = err.message;
  }
});

function showMaxDone(name) {
  const card = document.querySelector('.max-card');
  card.innerHTML = `
    <h2 class="max-title">WaiTER MAX</h2>
    <p class="max-line">Paid. ${esc(name)} is on the list.</p>
    <p class="max-note">Show this screen at the counter for your express lane,
       a bottle of WaiTER and a pack of Oreos, every class.</p>
    <button type="button" class="max-close" id="maxDone">Close</button>`;
  document.getElementById('maxDone').addEventListener('click', hideMax);
}

/* Coming back from Stripe. The page checks with the server, which checks with
   Stripe, before saying a word about being signed up. */
async function settleMax() {
  const session = new URLSearchParams(location.search).get('max_session_id');
  if (!session) return false;

  const card = document.getElementById('maxOffer');
  card.hidden = false;
  card.classList.add('up');
  document.querySelector('.max-card').innerHTML =
    '<h2 class="max-title">WaiTER MAX</h2><p class="max-line">Confirming your payment…</p>';

  for (let attempt = 0; attempt < 6; attempt++) {
    const res = await fetch('/api/waiter-max?session_id=' + encodeURIComponent(session));
    if (res.ok) {
      const paid = await res.json();
      showMaxDone(paid.name);
      return true;
    }
    if (res.status !== 402) break;
    await new Promise((r) => setTimeout(r, 900));
  }

  document.querySelector('.max-card').innerHTML =
    `<h2 class="max-title">WaiTER MAX</h2>
     <p class="max-line">We could not confirm that payment. Nothing has been charged twice;
        ask at the counter and they can check.</p>
     <button type="button" class="max-close" id="maxDone">Close</button>`;
  document.getElementById('maxDone').addEventListener('click', hideMax);
  return true;
}
// No stray tap or key closes this: the offer goes when No thanks is pressed,
// and not before.

settleMax();
load();
</script>
</body>
</html>
