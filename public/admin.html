<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ES30 Cafe Admin</title>
<meta name="theme-color" content="#FFEBAF">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<main class="admin">
  <div class="admin-head">
    <h1>ES30 Cafe Admin</h1>
    <a href="/">view cafe</a>
  </div>

  <!-- Sign in. Replaced by the dashboard once the code is accepted. -->
  <form class="signin" id="signin" hidden>
    <label for="token">Staff code</label>
    <div class="pw">
      <input type="password" id="token" autocomplete="current-password">
      <button type="button" class="pw-eye" id="showCode" aria-pressed="false" aria-label="Show the code">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="pw-open" d="M1.8 12s3.7-6 10.2-6 10.2 6 10.2 6-3.7 6-10.2 6S1.8 12 1.8 12z"/>
          <circle class="pw-open" cx="12" cy="12" r="3.1"/>
          <line class="pw-slash" x1="4" y1="20" x2="20" y2="4"/>
        </svg>
      </button>
    </div>
    <p class="field-error" id="signinError"></p>
    <button class="pay ready" type="submit">Sign in</button>
  </form>

  <div id="dash" hidden>

    <section class="panel">
      <h2>Takings</h2>
      <div class="tiles">
        <div class="tile">
          <p class="tile-value" id="takingsToday">$0.00</p>
          <p class="tile-label">today, <span id="ordersToday">0</span> orders</p>
        </div>
        <div class="tile">
          <p class="tile-value" id="takingsAll">$0.00</p>
          <p class="tile-label">all time, <span id="ordersAll">0</span> orders</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Break</h2>
        <span class="break-left" id="breakLeft"></span>
      </div>

      <div class="admin-actions break-actions">
        <button class="pay ready" type="button" id="startBreak">Start 10 minutes</button>
        <button class="ghost-pill" type="button" id="stopBreak" hidden>Stop</button>
      </div>
    </section>

    <section class="panel">
      <h2>Menu and stock</h2>
      <form id="stockForm">
        <div id="stockList"></div>
        <div class="admin-actions">
          <button class="pay ready" type="submit" id="saveBtn">Save</button>
        </div>
        <p class="admin-msg" id="msg"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Add an item</h2>
      <form id="addForm" class="add-form">
        <div class="add-grid">
          <label class="fld">
            <span>Name</span>
            <input type="text" id="newName" placeholder="Gatorade" maxlength="60">
          </label>
          <label class="fld fld-narrow">
            <span>Price</span>
            <input type="text" id="newPrice" inputmode="decimal" placeholder="3.00">
          </label>
          <label class="fld fld-narrow">
            <span>How many</span>
            <input type="text" id="newStock" inputmode="numeric" placeholder="12">
          </label>
          <label class="fld">
            <span>Section</span>
            <input type="text" id="newSection" list="sectionList" placeholder="Drinks" maxlength="40">
            <datalist id="sectionList"></datalist>
          </label>
          <label class="fld">
            <span>Group (optional)</span>
            <input type="text" id="newGroup" list="groupList" placeholder="Sweet" maxlength="40">
            <datalist id="groupList"></datalist>
          </label>
          <label class="fld fld-wide">
            <span>Description (optional)</span>
            <input type="text" id="newDesc" maxlength="140">
          </label>
        </div>
        <p class="field-error" id="addError"></p>
        <div class="admin-actions">
          <button class="pay ready" type="submit" id="addBtn">Add to menu</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Orders</h2>
      <p class="panel-note" id="ordersNote"></p>
      <ol class="list" id="orderList"></ol>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Giveaway entries</h2>
        <button type="button" class="ghost-pill" id="copyBtn">Copy all</button>
      </div>
      <p class="panel-note" id="entriesNote"></p>
      <ol class="list" id="entryList"></ol>
    </section>

  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
