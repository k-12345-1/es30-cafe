<!doctype html>
<meta charset="utf-8">
<title>The ES30 Cafe Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --hand: "Architects Daughter", cursive; --banner: "Archivo Narrow", sans-serif;
          --cream: #FFEBAF; --ink: #2F6A79; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; background: var(--cream); color: var(--ink);
         font-family: var(--hand); -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; padding: 52px 64px 44px; }

  .head { font-family: var(--banner); font-size: 78px; text-transform: uppercase;
          text-align: center; line-height: 1; }
  .deck { font-size: 32px; text-align: center; margin-top: 12px; }

  /* The rail is the spine: every stop hangs off the same line. */
  .track { height: 740px; display: flex; align-items: center; margin-top: 18px; position: relative; }
  /* The spine runs straight, forks where the company did, and rejoins at the merger. */
  .rail { position: absolute; inset: 0; width: 1920px; height: 740px; left: -64px;
          stroke: var(--ink); stroke-width: 5; fill: none; }
  .rail path { opacity: 0.35; }
  .stops { display: flex; width: 100%; position: relative; }
  /* Three rows: label above, dot on the rail, label below. */
  .stop { flex: 1; height: 740px; display: grid; grid-template-rows: 350px 40px 350px;
          justify-items: center; padding: 0 14px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--cream);
         border: 5px solid var(--ink); }
  .stop.now .dot { background: var(--ink); }

  /* Alternating sides keep the labels off each other at this density. */
  .above { grid-row: 1; align-self: end; padding-bottom: 26px; text-align: center; }
  .below { grid-row: 3; align-self: start; padding-top: 26px; text-align: center; }
  .dot { grid-row: 2; align-self: center; }
  .when { font-family: var(--banner); font-size: 25px; text-transform: uppercase;
          letter-spacing: 0.08em; opacity: 0.8; }
  .what { font-family: var(--banner); font-size: 40px; text-transform: uppercase;
          line-height: 1.06; margin-top: 4px; }
  .note { font-size: 25px; line-height: 1.3; margin-top: 8px; }
  .lesson { font-size: 24px; line-height: 1.3; margin-top: 10px; opacity: 0.85;
            -webkit-text-stroke: 0.5px var(--ink); }

  .branch { font-family: var(--banner); font-size: 27px; text-transform: uppercase;
            letter-spacing: 0.06em; fill: var(--ink); stroke: none; }
  .foot { text-align: center; font-size: 28px; margin-top: auto;
          -webkit-text-stroke: 0.6px var(--ink); }
</style>

<h1 class="head">The ES30 Cafe arc</h1>
<p class="deck">One semester, one lecture hall, four decisions</p>

<div class="track">
  <svg class="rail" viewBox="0 0 1920 740">
    <path d="M 48 370 H 1184"/>
    <path d="M 1184 370 C 1300 370 1300 288 1408 288 C 1516 288 1516 370 1632 370"/>
    <path d="M 1184 370 C 1300 370 1300 452 1408 452 C 1516 452 1516 370 1632 370"/>
    <path d="M 1632 370 H 1872"/>
    <text class="branch" x="1408" y="345" text-anchor="middle">ES30 Cafe</text>
    <text class="branch" x="1408" y="415" text-anchor="middle">Cafe ES30</text>
  </svg>
  <div class="stops" id="stops"></div>
</div>

<p class="foot">Back together, at one table, this Wednesday</p>

<script>
  // Each stop carries the decision and the lesson it cost us to learn.
  const STOPS = [
    ['Step one', 'The problem', 'Nobody can get a snack or a drink during a 75-minute lecture. Our go-to-market: sell at the break, in the room, to a captive crowd.',
     'Find the problem in front of you.'],
    ['Step two', 'Better margins', 'We cut the online checkout for a printed menu and Venmo, repriced every item, and changed what we stocked.',
     'Jamal and Sheldon: learn as much as you can as quickly as you can.'],
    ['Step three', 'We split', 'ES30 Cafe and Cafe ES30, one at each entrance, same menu, same prices.',
     'A vesting schedule made the split cheap.'],
    ['This week', 'Back together', 'Executive coaching, one merger, free stickers and a free Insomnia cookie.',
     'Anna Berger on working through co-founder dynamics.']
  ];

  stops.innerHTML = STOPS.map(([when, what, note, lesson], i) => `
    <div class="stop${i === STOPS.length - 1 ? ' now' : ''}">
      <div class="${i % 2 ? 'below' : 'above'}">
        <p class="when">${when}</p>
        <p class="what">${what}</p>
        <p class="note">${note}</p>
        <p class="lesson">${lesson}</p>
      </div>
      <span class="dot"></span>
    </div>`).join('');
</script>
