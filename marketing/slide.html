<!doctype html>
<meta charset="utf-8">
<title>ES30 Cafe slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFEBAF;
    --ink: #2F6A79;
    --hand: "Architects Daughter", cursive;
    --banner: "Archivo Narrow", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1920px; height: 1080px;
    background: var(--cream); color: var(--ink);
    font-family: var(--hand);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding: 72px 110px 0;
  }

  /* the sign and the goods on one side, the code on the other */
  .top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    column-gap: 70px;
  }
  .left { display: flex; flex-direction: column; align-items: center; gap: 44px; }
  .banner { width: 660px; }
  .goods { width: 400px; }

  .right { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .qr-card {
    border: 7px solid var(--ink);
    border-radius: 34px;
    padding: 26px;
    background: var(--cream);
    line-height: 0;
  }
  .qr-card img { width: 520px; height: 520px; }
  .url { font-size: 38px; -webkit-text-stroke: 0.4px var(--ink); }

  /* the ask and the call to action, in the handwriting the address is set in */
  .tag {
    font-size: 36px; text-align: center; line-height: 1.5;
    -webkit-text-stroke: 0.4px var(--ink);
  }

  /* where to collect, across the width of the slide rather than under one half */
  .band {
    flex: 1;
    display: grid;
    place-items: center;
  }

  .pickup {
    font-family: var(--banner);
    font-size: 44px; line-height: 1.45;
    letter-spacing: 0.02em;
    -webkit-text-stroke: 0;
  }
</style>
<div class="top">
  <div class="left">
    <img class="banner" src="../public/banner.png" alt="ES30 Cafe">
    <img class="goods" src="../public/drink.png" alt="">
    <p class="tag">Want a snack or drink during ES30 lecture?<br>Order from ES30 CAFE!</p>
  </div>
  <div class="right">
    <div class="qr-card"><img src="qr.png" alt="QR code to es30-cafe.onrender.com"></div>
    <p class="url">Visit: es30-cafe.onrender.com</p>
  </div>
</div>
<div class="band">
  <p class="tag pickup">Pick up during the 10-minute break at reception table near entrance of Lowell Lecture Hall.</p>
</div>
