<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ES30 Cafe</title>
<meta name="theme-color" content="#4C9DB0">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ES30 Cafe">
<meta property="og:title" content="ES30 Cafe">
<meta property="og:description" content="Snacks and drinks for ES30.">
<meta property="og:url" content="%PUBLIC_URL%/">
<meta property="og:image" content="%PUBLIC_URL%/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ES30 Cafe: a cookie and a can of Celsius">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="card">
    <div class="card-scroll" id="scroller">

      <!-- ---------- screen one: splash ---------- -->
      <section class="screen splash">
        <img class="art-banner" src="banner.png" alt="ES30 Cafe" width="900" height="256">
        <img class="art-drink" src="drink.png" alt="" width="760" height="543">

        <button class="ghost-btn" id="viewMenu">View Menu</button>
      </section>

      <!-- ---------- screen two: the menu ---------- -->
      <section class="screen menu" id="menu">
        <!-- The break clock. Hidden until staff start one. -->
        <div class="flipclock" id="breakClock">
          <p class="flip-label">10-Minute Break Countdown</p>
          <div class="flip-row">
            <span class="flip" data-slot="0"><span class="face top">0</span><span class="face bottom" data-value="0"></span><span class="leaf leaf-top">0</span><span class="leaf leaf-bottom" data-value="0"></span></span>
            <span class="flip" data-slot="1"><span class="face top">0</span><span class="face bottom" data-value="0"></span><span class="leaf leaf-top">0</span><span class="leaf leaf-bottom" data-value="0"></span></span>
            <span class="flip-colon" aria-hidden="true"></span>
            <span class="flip" data-slot="2"><span class="face top">0</span><span class="face bottom" data-value="0"></span><span class="leaf leaf-top">0</span><span class="leaf leaf-bottom" data-value="0"></span></span>
            <span class="flip" data-slot="3"><span class="face top">0</span><span class="face bottom" data-value="0"></span><span class="leaf leaf-top">0</span><span class="leaf leaf-bottom" data-value="0"></span></span>
          </div>
        </div>

        <div id="menuBody"></div>

        <p class="footnote" id="footnote" hidden></p>

        <footer class="foot">
          <p class="foot-line" id="footHours"></p>
          <p class="foot-line" id="footAddress"></p>
          <p class="foot-line" id="footEmail"></p>
        </footer>
      </section>

    </div>

    <!-- ---------- cart, pinned inside the card ---------- -->
    <button class="cart-bar" id="cartBar">
      <span class="cart-bar-summary">
        <span id="cartCount">0 items</span>
        <span id="cartTotal">$0.00</span>
      </span>
      <span class="cart-bar-cta">View cart</span>
    </button>

    <div class="sheet-scrim" id="scrim"></div>

    <aside class="sheet" id="sheet" aria-label="Your cart">
      <div class="sheet-top">
        <h3>Your order</h3>
        <button class="close" id="closeSheet" aria-label="Close">&times;</button>
      </div>

      <div class="cart-list" id="cartList"></div>

      <div class="totals">
        <span>Total</span>
        <span id="sheetTotal">$0.00</span>
      </div>

      <form id="checkoutForm" novalidate>
        <label for="name">Name for the order</label>
        <input type="text" id="name" name="name" autocomplete="name" placeholder="First and Last Name">
        <p class="err" id="err"></p>
        <button class="pay" type="submit" id="payBtn">Checkout</button>
      </form>
    </aside>

    <!-- Stripe draws its card form into this, so paying never leaves the cafe. -->
    <section class="pay-screen" id="payScreen" hidden aria-label="Payment">
      <div class="pay-top">
        <button class="close" id="closePay" aria-label="Back to your order">&larr;</button>
        <p class="pay-total" id="payTotal"></p>
      </div>
      <div id="stripeMount"></div>
    </section>

  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script src="app.js"></script>
</body>
</html>
